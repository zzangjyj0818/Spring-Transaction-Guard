name: 버그 리포트
description: 재현 가능한 오류나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 문제를 빠르게 재현할 수 있도록 아래 항목을 작성해 주세요.

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 명확하고 간결하게 설명해 주세요.
      placeholder: 실제 동작과 그로 인해 발생한 문제를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 최소 재현 코드, 저장소 링크 또는 단계별 재현 절차를 알려주세요. 민감정보는 제거해 주세요.
      placeholder: |
        1. ... 설정으로 애플리케이션을 실행합니다.
        2. ... 메서드를 호출합니다.
        3. ... 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제 재현에 사용한 버전을 적어주세요.
      placeholder: |
        - Transaction Guard: 0.1.0
        - Spring Boot: 3.5.x
        - Spring Framework: 6.2.x
        - Java: 21
        - Gradle: 8.x
        - OS: macOS / Linux / Windows
    validations:
      required: true

  - type: dropdown
    id: reporter_mode
    attributes:
      label: Reporter 모드
      description: 문제 발생 당시 사용한 모드를 선택해 주세요.
      options:
        - LOG
        - THROW
        - Custom Reporter
        - 알 수 없음 또는 해당 없음
    validations:
      required: true

  - type: dropdown
    id: propagation
    attributes:
      label: 트랜잭션 Propagation
      description: 문제와 관련된 트랜잭션 전파 방식을 선택해 주세요.
      options:
        - REQUIRED
        - REQUIRES_NEW
        - NOT_SUPPORTED
        - 기타
        - 알 수 없음 또는 해당 없음
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 스택 트레이스
      description: 관련 로그를 붙여 넣어 주세요. 토큰, 헤더, 쿼리 파라미터 등 민감정보는 반드시 제거해 주세요.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 발생 빈도, commit/rollback 여부, 관련 TG 코드(TG001/TG002/TG003) 등 도움이 될 내용을 적어주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈에서 같은 문제를 검색했습니다.
          required: true
        - label: 로그와 예제에서 민감정보를 제거했습니다.
          required: true

