name: 기능 제안
description: 새로운 탐지, 정책, Reporter 또는 개발 경험 개선을 제안해 주세요.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        제안해 주셔서 감사합니다. 해결하려는 문제와 기대 효과를 중심으로 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 위험이 있으며 누구에게 영향을 주는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결책
      description: 원하는 동작, 설정, API 또는 사용 예시를 설명해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - Core Domain / Policy
        - Transaction Observation
        - External Call Observation
        - Reporter
        - Spring Boot Auto Configuration
        - Documentation / Example
        - Build / CI
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 현재 사용 중인 우회 방법이나 검토한 다른 접근이 있다면 알려주세요.

  - type: textarea
    id: scope
    attributes:
      label: 범위와 추가 정보
      description: 하위 호환성, 성능, 민감정보 노출 가능성 또는 관련 자료가 있다면 적어주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈에서 유사한 제안을 검색했습니다.
          required: true
        - label: 이 제안이 자동 리팩터링이나 트랜잭션 매니저 대체가 아닌 탐지·정책·보고라는 프로젝트 목적에 부합하는지 확인했습니다.
          required: true

